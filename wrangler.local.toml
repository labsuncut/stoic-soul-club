# Local development only. Not read by Cloudflare: bindings in production come from the Pages dashboard.
# Run: npx wrangler pages dev public --config wrangler.local.toml
name = "stoic-soul-club"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "stoic-local"
database_id = "local"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "stoic-images"
